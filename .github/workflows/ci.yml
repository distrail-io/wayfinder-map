name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: vet
        run: go vet -mod=vendor ./...
      - name: test
        run: go test -mod=vendor -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: vendor matches go.mod
        run: |
          go mod vendor
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: cross-build
        run: |
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -mod=vendor -trimpath -o /dev/null ./cmd/wayfinder-map
          done
