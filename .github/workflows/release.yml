name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases made with GITHUB_TOKEN trigger no other workflows, so the build
  # runs here, gated on release-please having just cut one.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: build
        run: |
          mkdir dist
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -mod=vendor -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/wayfinder-map_${os}_${arch}" ./cmd/wayfinder-map
          done
          (cd dist && sha256sum wayfinder-map_* > SHA256SUMS)
      # Build provenance attestations are paused: they need a public repo or
      # GitHub Enterprise Cloud (#14).
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
