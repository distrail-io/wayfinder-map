name: contract

# Runs the exported GraphQL queries against this repo's own map, so GitHub's
# schema drifting under them fails here rather than in a user's terminal.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: contract check
        env:
          GH_TOKEN: ${{ github.token }}
        run: go test -mod=vendor -tags contract -run TestContract -count=1 -v ./internal/github
